<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q4 planning notes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

body{background:#fffdf5;color:#2c2c2c;display:flex}
.folders{width:190px;background:#f4f1e6;padding:12px;height:100vh}
.folders a{display:block;padding:4px 8px;color:#2c2c2c;text-decoration:none;border-radius:5px}
.folders a.cur{background:#e6dfc4}
.nlist{width:260px;border-right:1px solid #e3ddc6;height:100vh;margin:0;padding:0;list-style:none}
.nlist li{padding:10px 14px;border-bottom:1px solid #eee8d2}
.nlist .t{font-weight:700}.nlist .s{color:#8a8570;font-size:13px}
.editor{flex:1;padding:24px 36px}
.editor textarea{width:100%;height:80vh;border:0;background:none;font:16px/1.6 -apple-system,sans-serif;outline:none;resize:none}
.tb{padding:6px 12px;border-bottom:1px solid #e3ddc6;display:flex;gap:8px}
.tb button{background:none;border:0;padding:4px 8px}
</style>
</head>
<body>
  <aside class="folders" aria-label="Sidebar">
    <h3>Folders</h3>
    <a href="#">iCloud</a>
    <a class="cur" href="#">Work</a>
    <a href="#">Recently Deleted</a>
  </aside>
  <ul class="nlist" aria-label="Notes">
    <li>
      <div class="t">Groceries and errands</div>
      <div class="s">Today</div>
    </li>
    <li>
      <div class="t">Q4 planning notes</div>
      <div class="s">Yesterday</div>
    </li>
    <li>
      <div class="t">Book list</div>
      <div class="s">Last week</div>
    </li>
  </ul>
  <section class="editor" aria-label="Editor">
    <div class="tb" aria-label="Notes toolbar" role="group">
      <button aria-label="New Note">＋</button>
      <button aria-label="Delete">🗑</button>
      <button aria-label="Share">↗</button>
    </div>
    <textarea aria-label="Note body" placeholder="">Q4 planning notes

Goals
- Ship v2 onboarding by 20 November
- Cut the support backlog below 40 tickets
- Hire one more backend engineer by 15 December

Risks
- Design review slips past 30 October
- Vendor contract renewal on 1 December

Open questions
- Who owns the migration runbook?
</textarea>
  </section>
</body>
</html>
