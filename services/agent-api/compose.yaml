services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex_agent
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cortex-agent-postgres:/var/lib/postgresql/data

volumes:
  cortex-agent-postgres:
