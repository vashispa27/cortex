<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Cortex · Launch film</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #080b10;
        color: #edf4ff;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-content: center;
      }
      main {
        width: min(100vw, 160vh);
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #101216;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 18px;
        background: #151c27;
      }
      button,
      a {
        border: 1px solid #395475;
        background: #213650;
        color: #e4f1ff;
        border-radius: 6px;
        padding: 9px 15px;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      input {
        flex: 1;
        min-width: 100px;
        accent-color: #65a8ff;
      }
      span {
        color: #9aacbf;
        font-size: 11px;
      }
      .capture {
        display: block;
        overflow: hidden;
      }
      .capture main {
        width: 100vw;
        height: 100vh;
      }
      .capture canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .capture footer {
        display: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #8cc5ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <audio id="narration" src="/media/launch-audio.m4a" preload="auto"></audio>
    <main>
      <canvas
        id="film"
        width="1920"
        height="1080"
        aria-label="Cortex launch film: recall, permanent memory, local context, and shared tasks across agents."
      ></canvas>
      <footer>
        <button id="play">Play film</button><button id="restart">Restart</button
        ><input
          type="range"
          id="seek"
          min="0"
          max="42"
          value="0"
          step="0.01"
          aria-label="Video time"
        /><span id="time">0:00 / 0:42</span
        ><button id="voice" aria-pressed="true">Voice on</button
        ><button id="export">Export video</button><a href="/">Website ↗</a>
      </footer>
    </main>
    <script type="module" src="/src/launch.js"></script>
  </body>
</html>
