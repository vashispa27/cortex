[package]
name = "goldfish-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
goldfish-contracts = { path = "../contracts" }
goldfish-capture = { path = "../capture" }
goldfish-memory = { path = "../memory" }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
subtle = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "goldfish-daemon"
path = "src/main.rs"
