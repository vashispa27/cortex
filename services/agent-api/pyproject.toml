[project]
name = "cortex-agent-api"
version = "0.1.0"
description = "Local, durable, approval-gated agent API for Cortex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "browser-use==0.13.14",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema==4.26.0",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "tldextract==5.3.0",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "playwright==1.64.1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
cortex-agent = "cortex_agent_api.cli:main"
cortex-agent-api = "cortex_agent_api.main:run"
cortex-agent-worker = "cortex_agent_api.worker:main"
cortex-agent-migrate = "cortex_agent_api.migrate:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL and, where noted, Docker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_agent_api"]
